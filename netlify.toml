[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"
  # Install build tools even when the site has NODE_ENV=production.
  NPM_FLAGS = "--include=dev"

[[redirects]]
  from = "/documents/Michel_Popolin_ATS_Resume.pdf"
  to = "/resume/michel_popolin.pdf"
  status = 301

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
